services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: incident-agent-postgres
    environment:
      POSTGRES_DB: incident_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: